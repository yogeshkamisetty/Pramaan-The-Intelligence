<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="light1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="light2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow2"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <!-- Night sky bg -->
  <rect width="400" height="260" fill="url(#sky)"/>
  <!-- Ground -->
  <rect x="0" y="180" width="400" height="80" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
  <!-- House silhouette -->
  <polygon points="60,180 60,110 130,75 200,110 200,180" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <rect x="90" y="120" width="30" height="35" fill="#1E293B" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="105" y="142" text-anchor="middle" fill="#EF4444" font-size="8" font-family="monospace">BREACH</text>
  <!-- Door -->
  <rect x="140" y="140" width="25" height="40" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <!-- Police car glow (blue) -->
  <ellipse cx="300" cy="180" rx="60" ry="40" fill="url(#light1)" filter="url(#glow2)"/>
  <!-- Police car silhouette -->
  <rect x="270" y="170" width="60" height="20" rx="5" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <rect x="280" y="163" width="40" height="10" rx="3" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8"/>
  <!-- Police light bar -->
  <rect x="285" y="160" width="8" height="4" rx="1" fill="#3B82F6" opacity="0.9"/>
  <rect x="307" y="160" width="8" height="4" rx="1" fill="#EF4444" opacity="0.9"/>
  <!-- Evidence markers -->
  <g fill="#FBBF24" font-family="monospace" font-size="7" font-weight="bold">
    <circle cx="100" cy="195" r="5" fill="#FBBF24"/>
    <text x="100" y="198" text-anchor="middle" fill="#0F172A">1</text>
    <circle cx="145" cy="200" r="5" fill="#FBBF24"/>
    <text x="145" y="203" text-anchor="middle" fill="#0F172A">2</text>
    <circle cx="175" cy="192" r="5" fill="#FBBF24"/>
    <text x="175" y="195" text-anchor="middle" fill="#0F172A">3</text>
  </g>
  <!-- Flashlight beam -->
  <polygon points="230,150 210,195 250,195" fill="#FBBF24" opacity="0.08"/>
  <!-- Forensic officer silhouette -->
  <circle cx="230" cy="142" r="7" fill="#475569"/>
  <rect x="226" y="148" width="8" height="18" rx="2" fill="#475569"/>
  <line x1="230" y1="158" x2="222" y2="175" stroke="#475569" stroke-width="2.5"/>
  <line x1="230" y1="158" x2="238" y2="175" stroke="#475569" stroke-width="2.5"/>
  <!-- Crime Scene Tape -->
  <rect x="40" y="175" width="220" height="8" fill="#FBBF24" opacity="0.8" rx="1"/>
  <text x="150" y="182" text-anchor="middle" fill="#0F172A" font-size="6" font-family="monospace" font-weight="bold" letter-spacing="2">CRIME SCENE - DO NOT CROSS</text>
  <!-- Status overlay -->
  <rect x="10" y="10" width="140" height="24" rx="4" fill="#0F172A" stroke="#EF4444" stroke-width="0.8" opacity="0.9"/>
  <circle cx="22" cy="22" r="4" fill="#EF4444" opacity="0.8"/>
  <text x="32" y="26" fill="#EF4444" font-size="9" font-family="monospace" font-weight="bold">ACTIVE INVESTIGATION</text>
</svg>
