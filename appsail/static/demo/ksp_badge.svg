<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
    <linearGradient id="inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0B0E14" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="#0B0E14" stroke="#1E3A5F" stroke-width="2"/>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#shield)" stroke-width="3" opacity="0.7"/>
  <!-- Shield shape -->
  <path d="M100 25 L155 50 L155 110 Q155 155 100 180 Q45 155 45 110 L45 50 Z" fill="url(#inner)" stroke="#38BDF8" stroke-width="1.5" filter="url(#glow)"/>
  <!-- Inner shield -->
  <path d="M100 40 L145 60 L145 105 Q145 145 100 168 Q55 145 55 105 L55 60 Z" fill="none" stroke="#0EA5E9" stroke-width="0.8" opacity="0.5"/>
  <!-- Circuit pattern lines -->
  <g stroke="#38BDF8" stroke-width="0.6" opacity="0.4">
    <line x1="70" y1="70" x2="90" y2="70"/>
    <line x1="90" y1="70" x2="90" y2="85"/>
    <line x1="110" y1="70" x2="130" y2="70"/>
    <line x1="110" y1="70" x2="110" y2="85"/>
    <circle cx="90" cy="70" r="2" fill="#38BDF8"/>
    <circle cx="110" cy="70" r="2" fill="#38BDF8"/>
  </g>
  <!-- Eye / AI surveillance motif -->
  <ellipse cx="100" cy="95" rx="28" ry="16" fill="none" stroke="#0EA5E9" stroke-width="1.8" filter="url(#glow)"/>
  <circle cx="100" cy="95" r="8" fill="#0EA5E9" opacity="0.9"/>
  <circle cx="100" cy="95" r="3" fill="#38BDF8"/>
  <!-- Crossed swords -->
  <g stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <line x1="72" y1="120" x2="128" y2="140"/>
    <line x1="128" y1="120" x2="72" y2="140"/>
  </g>
  <!-- Text: KSP -->
  <text x="100" y="160" text-anchor="middle" fill="#38BDF8" font-size="16" font-family="monospace" font-weight="bold" letter-spacing="3" filter="url(#glow)">KSP</text>
  <!-- Text: PRAMAAN -->
  <text x="100" y="175" text-anchor="middle" fill="#94A3B8" font-size="8" font-family="monospace" font-weight="600" letter-spacing="4">PRAMAAN</text>
</svg>
