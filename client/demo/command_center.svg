<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="sky3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="40%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="screenGlow"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <!-- Dark room BG -->
  <rect width="400" height="260" fill="url(#sky3)"/>
  <!-- Large center screen -->
  <rect x="90" y="20" width="220" height="130" rx="4" fill="#0F172A" stroke="#1E3A5F" stroke-width="1.5"/>
  <rect x="95" y="25" width="210" height="120" rx="2" fill="#0B1628"/>
  <!-- Heat map on screen -->
  <g opacity="0.7">
    <circle cx="140" cy="70" r="18" fill="#EF4444" opacity="0.3"/>
    <circle cx="140" cy="70" r="10" fill="#EF4444" opacity="0.5"/>
    <circle cx="200" cy="90" r="14" fill="#F59E0B" opacity="0.3"/>
    <circle cx="200" cy="90" r="7" fill="#F59E0B" opacity="0.5"/>
    <circle cx="260" cy="60" r="12" fill="#3B82F6" opacity="0.3"/>
    <circle cx="260" cy="60" r="6" fill="#3B82F6" opacity="0.5"/>
    <!-- Grid lines -->
    <g stroke="#1E3A5F" stroke-width="0.3">
      <line x1="95" y1="55" x2="305" y2="55"/>
      <line x1="95" y1="85" x2="305" y2="85"/>
      <line x1="95" y1="115" x2="305" y2="115"/>
      <line x1="160" y1="25" x2="160" y2="145"/>
      <line x1="230" y1="25" x2="230" y2="145"/>
    </g>
  </g>
  <!-- Screen label -->
  <text x="100" y="140" fill="#38BDF8" font-size="7" font-family="monospace" opacity="0.8">CRIME HOTSPOT ANALYSIS // BENGALURU METRO</text>
  <!-- Side screens -->
  <rect x="15" y="35" width="65" height="45" rx="2" fill="#0B1628" stroke="#1E3A5F" stroke-width="1"/>
  <!-- Network graph mini -->
  <g stroke="#0EA5E9" stroke-width="0.5" opacity="0.6">
    <circle cx="35" cy="50" r="3" fill="#0EA5E9"/>
    <circle cx="55" cy="45" r="2" fill="#EF4444"/>
    <circle cx="65" cy="60" r="2" fill="#F59E0B"/>
    <circle cx="40" cy="65" r="2" fill="#0EA5E9"/>
    <line x1="35" y1="50" x2="55" y2="45"/>
    <line x1="35" y1="50" x2="40" y2="65"/>
    <line x1="55" y1="45" x2="65" y2="60"/>
  </g>
  <rect x="15" y="90" width="65" height="45" rx="2" fill="#0B1628" stroke="#1E3A5F" stroke-width="1"/>
  <!-- Bar chart mini -->
  <g fill="#38BDF8" opacity="0.5">
    <rect x="22" y="115" width="6" height="14" rx="1"/>
    <rect x="32" y="108" width="6" height="21" rx="1"/>
    <rect x="42" y="112" width="6" height="17" rx="1"/>
    <rect x="52" y="105" width="6" height="24" rx="1"/>
    <rect x="62" y="118" width="6" height="11" rx="1"/>
  </g>
  <!-- Right screen -->
  <rect x="320" y="35" width="65" height="100" rx="2" fill="#0B1628" stroke="#1E3A5F" stroke-width="1"/>
  <!-- CCTV feed mini -->
  <rect x="325" y="40" width="55" height="35" rx="1" fill="#111827"/>
  <text x="352" y="60" text-anchor="middle" fill="#EF4444" font-size="6" font-family="monospace">● LIVE</text>
  <rect x="325" y="80" width="55" height="35" rx="1" fill="#111827"/>
  <text x="352" y="100" text-anchor="middle" fill="#10B981" font-size="6" font-family="monospace">● CAM-02</text>
  <!-- Console desk -->
  <rect x="60" y="160" width="280" height="15" rx="2" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
  <!-- Keyboard -->
  <g fill="#334155" opacity="0.5">
    <rect x="130" y="163" width="60" height="4" rx="1"/>
    <rect x="195" y="163" width="40" height="4" rx="1"/>
    <rect x="130" y="169" width="70" height="3" rx="1"/>
  </g>
  <!-- Officers silhouettes -->
  <g fill="#475569">
    <circle cx="120" cy="190" r="8"/>
    <rect x="113" y="197" width="14" height="25" rx="3"/>
    <circle cx="200" cy="188" r="8"/>
    <rect x="193" y="195" width="14" height="28" rx="3"/>
    <circle cx="280" cy="192" r="7"/>
    <rect x="274" y="198" width="12" height="22" rx="3"/>
  </g>
  <!-- Floor -->
  <rect x="0" y="230" width="400" height="30" fill="#0F172A"/>
  <!-- Status bar -->
  <rect x="95" y="148" width="210" height="8" rx="1" fill="#0F172A" stroke="#1E3A5F" stroke-width="0.5"/>
  <rect x="97" y="150" width="80" height="4" rx="1" fill="#0EA5E9" opacity="0.6"/>
  <text x="200" y="154" text-anchor="middle" fill="#94A3B8" font-size="5" font-family="monospace">PRAMAAN AI ENGINE ACTIVE</text>
  <!-- Title -->
  <text x="200" y="250" text-anchor="middle" fill="#38BDF8" font-size="9" font-family="monospace" font-weight="bold" letter-spacing="2" opacity="0.7">KSP CRIME INTELLIGENCE COMMAND CENTER</text>
</svg>
